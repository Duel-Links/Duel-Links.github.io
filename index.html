<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Intelligent Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f7f9fc;
            --text-primary: #1a2332;
            --text-secondary: #4a5a72;
            --text-muted: #8a9aa8;
            --border-color: #dce4ec;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 20px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.3s ease;
            --accent: #4f6ef7;
            --accent-hover: #3a56d4;
            --danger: #ef476f;
            --success: #06d6a0;
            --warning: #ffb347;
            --urgent-color: #ef476f;
            --important-color: #ffb347;
            --general-color: #06d6a0;
            --sidebar-width: 220px;
        }
        [data-theme="dark"] {
            --bg-primary: #0f1724;
            --bg-secondary: #1a2332;
            --bg-card: #1e2a3a;
            --bg-input: #253040;
            --text-primary: #e8edf5;
            --text-secondary: #b0c0d0;
            --text-muted: #6a7a8a;
            --border-color: #2a3a4a;
            --shadow: 0 2px 12px rgba(0,0,0,0.4);
            --shadow-hover: 0 4px 20px rgba(0,0,0,0.5);
            --accent: #6a8aff;
            --accent-hover: #5a7aee;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            line-height: 1.6;
        }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:3px; }

        #loading-overlay {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:var(--bg-primary);
            display:flex; align-items:center; justify-content:center;
            z-index:9999; flex-direction:column; gap:16px;
            font-size:16px; color:var(--text-secondary);
        }
        #loading-overlay .spinner {
            width:40px; height:40px;
            border:4px solid var(--border-color);
            border-top-color:var(--accent);
            border-radius:50%;
            animation:spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* Login */
        #login-page { display:none; justify-content:center; align-items:center; min-height:100vh; padding:20px; background:var(--bg-primary); }
        .login-box {
            background:var(--bg-card); padding:40px 36px; border-radius:var(--radius);
            box-shadow:var(--shadow-hover); width:100%; max-width:400px;
            border:1px solid var(--border-color);
        }
        .login-box h1 { font-size:28px; font-weight:700; text-align:center; margin-bottom:6px; }
        .login-box .subtitle { text-align:center; color:var(--text-muted); margin-bottom:28px; font-size:14px; }
        .login-box .form-group { margin-bottom:18px; }
        .login-box label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:5px; }
        .login-box input {
            width:100%; padding:10px 14px; border:1px solid var(--border-color);
            border-radius:var(--radius-sm); background:var(--bg-input); color:var(--text-primary);
            font-size:14px; transition:border var(--transition), box-shadow var(--transition);
            outline:none;
        }
        .login-box input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,110,247,0.15); }
        .login-box .btn-login {
            width:100%; padding:12px; background:var(--accent); color:#fff;
            border:none; border-radius:var(--radius-sm); font-size:16px; font-weight:600;
            cursor:pointer; transition:background var(--transition);
        }
        .login-box .btn-login:hover { background:var(--accent-hover); }
        .login-box .error-msg { color:var(--danger); font-size:13px; text-align:center; margin-top:12px; min-height:20px; }
        .login-box .demo-hint {
            margin-top:18px; padding:12px 14px; background:var(--bg-input);
            border-radius:var(--radius-sm); font-size:13px; color:var(--text-muted);
            border:1px dashed var(--border-color);
        }

        /* Sidebar & Main Layout */
        #main-app { display:none; min-height:100vh; }
        .sidebar {
            position:fixed; top:0; left:0; width:var(--sidebar-width); height:100vh;
            background:var(--bg-secondary); border-right:1px solid var(--border-color);
            padding:20px 0; display:flex; flex-direction:column;
            transition:background var(--transition), border var(--transition);
            z-index:100; overflow-y:auto;
        }
        .sidebar .logo {
            padding:0 20px 20px; font-size:20px; font-weight:700; color:var(--accent);
            display:flex; align-items:center; gap:10px;
            border-bottom:1px solid var(--border-color); margin-bottom:16px;
        }
        .sidebar .logo i { font-size:22px; }
        .sidebar .nav-item {
            display:flex; align-items:center; gap:12px; padding:10px 20px;
            color:var(--text-secondary); text-decoration:none; cursor:pointer;
            transition:background var(--transition), color var(--transition);
            border-left:3px solid transparent; font-size:14px; font-weight:500;
        }
        .sidebar .nav-item:hover { background:var(--bg-input); color:var(--text-primary); }
        .sidebar .nav-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--bg-input); }
        .sidebar .nav-item i { width:20px; text-align:center; font-size:16px; }
        .sidebar .nav-section { padding:12px 20px 6px; font-size:11px; text-transform:uppercase; color:var(--text-muted); font-weight:600; }
        .sidebar .user-info {
            margin-top:auto; padding:16px 20px; border-top:1px solid var(--border-color);
            display:flex; align-items:center; gap:12px;
        }
        .sidebar .user-info .avatar {
            width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff;
            display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px;
            flex-shrink:0;
        }
        .sidebar .user-info .uname { font-size:14px; font-weight:500; }
        .sidebar .user-info .urole { font-size:12px; color:var(--text-muted); }
        .sidebar .user-info .logout-btn {
            margin-left:auto; background:none; border:none; color:var(--text-muted);
            cursor:pointer; font-size:16px; padding:4px 8px; border-radius:6px;
            transition:background var(--transition), color var(--transition);
        }
        .sidebar .user-info .logout-btn:hover { background:var(--danger); color:#fff; }

        .main-content {
            margin-left:var(--sidebar-width); padding:20px 28px 40px;
            min-height:100vh; transition:background var(--transition);
        }
        .page-header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:24px; flex-wrap:wrap; gap:12px;
        }
        .page-header h2 { font-size:24px; font-weight:600; }
        .page-header .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .theme-toggle {
            background:var(--bg-input); border:1px solid var(--border-color);
            border-radius:var(--radius-sm); padding:8px 12px; cursor:pointer;
            color:var(--text-secondary); font-size:16px;
        }
        .theme-toggle:hover { background:var(--border-color); }

        .btn {
            padding:8px 18px; border:none; border-radius:var(--radius-sm);
            font-size:14px; font-weight:500; cursor:pointer;
            transition:background var(--transition), transform 0.1s;
            display:inline-flex; align-items:center; gap:6px;
        }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:var(--accent-hover); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-danger:hover { background:#d63a5e; }
        .btn-success { background:var(--success); color:#fff; }
        .btn-success:hover { background:#05b88e; }
        .btn-warning { background:var(--warning); color:#fff; }
        .btn-warning:hover { background:#e69e3a; }
        .btn-outline { background:transparent; border:1px solid var(--border-color); color:var(--text-secondary); }
        .btn-outline:hover { background:var(--bg-input); }
        .btn-sm { padding:4px 12px; font-size:12px; }
        .btn-xs { padding:2px 10px; font-size:11px; }

        /* Dashboard Stats */
        .dashboard-grid {
            display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
            gap:16px; margin-bottom:24px;
        }
        .stat-card {
            background:var(--bg-card); border:1px solid var(--border-color);
            border-radius:var(--radius); padding:16px 20px;
            box-shadow:var(--shadow);
            cursor:pointer;
            transition:transform var(--transition), box-shadow var(--transition);
            position:relative;
            overflow:hidden;
        }
        .stat-card:hover {
            transform:translateY(-2px);
            box-shadow:var(--shadow-hover);
        }
        .stat-card .stat-label { font-size:13px; color:var(--text-muted); font-weight:500; }
        .stat-card .stat-value { font-size:28px; font-weight:700; margin-top:2px; }
        .stat-card .stat-hint { font-size:11px; color:var(--text-muted); margin-top:4px; opacity:0.7; }
        .stat-card.urgent .stat-value { color:var(--urgent-color); }
        .stat-card.important .stat-value { color:var(--important-color); }
        .stat-card.general .stat-value { color:var(--general-color); }
        .stat-card .click-hint { position:absolute; bottom:8px; right:12px; font-size:11px; color:var(--text-muted); opacity:0.4; }

        .todo-section {
            background:var(--bg-card); border:1px solid var(--border-color);
            border-radius:var(--radius); padding:20px;
            box-shadow:var(--shadow);
            margin-top:20px;
        }
        .todo-section .todo-header {
            display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:10px; margin-bottom:16px;
        }
        .todo-section .todo-header h3 { font-size:18px; font-weight:600; }
        .todo-filters {
            display:flex; gap:8px; flex-wrap:wrap;
        }
        .todo-filters .filter-btn {
            padding:4px 14px; border:1px solid var(--border-color);
            border-radius:20px; background:transparent; color:var(--text-secondary);
            font-size:12px; cursor:pointer; transition:all var(--transition);
        }
        .todo-filters .filter-btn:hover { background:var(--bg-input); }
        .todo-filters .filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

        .todo-item {
            display:flex; align-items:flex-start; gap:14px;
            padding:14px 0; border-bottom:1px solid var(--border-color);
            flex-wrap:wrap;
        }
        .todo-item:last-child { border-bottom:none; }
        .todo-item .todo-check {
            margin-top:2px; width:20px; height:20px; border-radius:50%;
            border:2px solid var(--border-color); background:transparent;
            cursor:pointer; flex-shrink:0;
            display:flex; align-items:center; justify-content:center;
            transition:all var(--transition); color:transparent;
        }
        .todo-item .todo-check:hover { border-color:var(--accent); }
        .todo-item .todo-check.done { background:var(--success); border-color:var(--success); color:#fff; }
        .todo-item .todo-body { flex:1; min-width:150px; }
        .todo-item .todo-body .todo-title { font-size:15px; font-weight:500; }
        .todo-item .todo-body .todo-meta {
            font-size:13px; color:var(--text-muted);
            display:flex; flex-wrap:wrap; gap:12px; margin-top:3px;
        }
        .todo-item .todo-body .todo-meta span { display:inline-flex; align-items:center; gap:4px; }
        .todo-item .todo-urgency {
            font-size:11px; font-weight:600; padding:2px 12px;
            border-radius:20px; text-transform:uppercase;
            flex-shrink:0;
        }
        .todo-item .todo-urgency.urgent { background:#ef476f20; color:var(--urgent-color); }
        .todo-item .todo-urgency.important { background:#ffb34720; color:var(--important-color); }
        .todo-item .todo-urgency.general { background:#06d6a020; color:var(--general-color); }
        .todo-item .todo-progress {
            flex-shrink:0; min-width:80px; display:flex; align-items:center; gap:8px;
            font-size:13px; color:var(--text-muted);
        }
        .todo-item .todo-progress .progress-bar {
            width:60px; height:4px; border-radius:2px; background:var(--border-color); overflow:hidden;
        }
        .todo-item .todo-progress .progress-bar .fill {
            height:100%; border-radius:2px; transition:width 0.4s ease;
        }
        .todo-item .todo-progress .progress-bar .fill.urgent { background:var(--urgent-color); }
        .todo-item .todo-progress .progress-bar .fill.important { background:var(--important-color); }
        .todo-item .todo-progress .progress-bar .fill.general { background:var(--general-color); }
        .todo-item .todo-actions {
            display:flex; gap:6px; flex-shrink:0;
        }
        .todo-item .todo-actions button {
            background:none; border:none; color:var(--text-muted);
            cursor:pointer; padding:4px 6px; border-radius:4px;
        }
        .todo-item .todo-actions button:hover { background:var(--bg-input); color:var(--text-primary); }
        .todo-item .todo-actions .delete-btn:hover { color:var(--danger); }
        .todo-empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
        .todo-empty i { font-size:48px; margin-bottom:12px; opacity:0.4; }

        .search-box {
            display:flex; gap:8px; align-items:center;
            background:var(--bg-input); border:1px solid var(--border-color);
            border-radius:var(--radius-sm); padding:4px 12px;
        }
        .search-box input {
            border:none; background:transparent; padding:6px 0;
            font-size:14px; color:var(--text-primary); outline:none; flex:1;
        }
        .search-box i { color:var(--text-muted); }

        /* Calendar */
        .calendar-wrapper {
            background:var(--bg-card); border:1px solid var(--border-color);
            border-radius:var(--radius); padding:20px;
            box-shadow:var(--shadow);
        }
        .calendar-header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:16px; flex-wrap:wrap; gap:8px;
        }
        .calendar-header .month-label { font-size:20px; font-weight:600; }
        .calendar-header .nav-btns { display:flex; gap:6px; }

        .calendar-grid {
            display:grid; grid-template-columns:repeat(7,1fr);
            gap:6px;
        }
        .calendar-grid .day-label {
            text-align:center; font-size:13px; font-weight:600;
            color:var(--text-muted); padding:8px 0;
        }
        .calendar-grid .day-cell {
            aspect-ratio:1/1;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            border-radius:var(--radius-sm);
            background:var(--bg-input);
            font-size:18px;
            font-weight:600;
            color:var(--text-secondary);
            cursor:pointer;
            transition:all var(--transition);
            position:relative;
            min-height:52px;
            padding:4px;
        }
        .calendar-grid .day-cell:hover { background:var(--border-color); transform:scale(1.02); }
        .calendar-grid .day-cell.other-month { color:var(--text-muted); opacity:0.4; }
        .calendar-grid .day-cell.today { background:var(--accent); color:#fff; box-shadow:0 0 0 3px rgba(79,110,247,0.3); }
        .calendar-grid .day-cell .day-num { font-size:20px; font-weight:700; line-height:1.2; }
        .calendar-grid .day-cell .day-badge {
            position:absolute; top:2px; right:2px;
            font-size:10px; font-weight:700; padding:1px 6px;
            border-radius:10px; min-width:18px; text-align:center;
            color:#fff;
        }
        .calendar-grid .day-cell .day-badge.urgent-badge { background:var(--urgent-color); }
        .calendar-grid .day-cell .day-badge.important-badge { background:var(--important-color); }
        .calendar-grid .day-cell .day-badge.general-badge { background:var(--general-color); }
        .calendar-grid .day-cell .day-badge.mixed-badge { background:var(--accent); }
        .calendar-grid .day-cell.has-todo { border-bottom:3px solid var(--accent); }
        .calendar-grid .day-cell.has-todo.urgent-day { border-bottom-color:var(--urgent-color); }
        .calendar-grid .day-cell.has-todo.important-day { border-bottom-color:var(--important-color); }

        .calendar-day-todos .todo-item-clickable {
            cursor:pointer;
            transition:background var(--transition), transform var(--transition);
            padding:8px 12px;
            border-radius:6px;
            background:var(--bg-input);
            border-left:3px solid var(--accent);
            display:flex;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
        }
        .calendar-day-todos .todo-item-clickable:hover {
            background:var(--border-color);
            transform:translateX(4px);
        }
        .calendar-day-todos .todo-item-clickable .click-hint {
            font-size:10px;
            color:var(--text-muted);
            opacity:0.5;
            margin-left:auto;
        }

        /* Modal */
        .modal-overlay {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.5); backdrop-filter:blur(4px);
            display:none; align-items:center; justify-content:center;
            z-index:1000; padding:20px;
        }
        .modal-overlay.show { display:flex; }
        .modal-box {
            background:var(--bg-card); border-radius:var(--radius);
            padding:28px 32px; max-width:620px; width:100%;
            max-height:90vh; overflow-y:auto; border:1px solid var(--border-color);
            box-shadow:var(--shadow-hover);
        }
        .modal-box .modal-title {
            font-size:20px; font-weight:600; margin-bottom:20px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .modal-box .modal-title .close-btn {
            background:none; border:none; font-size:22px;
            color:var(--text-muted); cursor:pointer;
        }
        .modal-box .modal-title .close-btn:hover { color:var(--text-primary); }
        .modal-box .form-group { margin-bottom:16px; }
        .modal-box label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:4px; }
        .modal-box input, .modal-box select, .modal-box textarea {
            width:100%; padding:8px 12px; border:1px solid var(--border-color);
            border-radius:var(--radius-sm); background:var(--bg-input);
            color:var(--text-primary); font-size:14px; outline:none;
            font-family:inherit;
        }
        .modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus {
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(79,110,247,0.12);
        }
        .modal-box .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .modal-box .form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
        .modal-box .form-actions {
            display:flex; justify-content:flex-end; gap:10px;
            margin-top:20px; padding-top:16px; border-top:1px solid var(--border-color);
        }
        .modal-box .step-input-group {
            display:flex; gap:8px; align-items:center; margin-bottom:6px;
        }
        .modal-box .step-input-group input { flex:1; }
        .modal-box .step-input-group button {
            background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px;
        }

        /* 迷你日历选择器 */
        .mini-calendar {
            display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;
            padding:8px; background:var(--bg-input); border-radius:var(--radius-sm);
            border:1px solid var(--border-color);
        }
        .mini-calendar .day-option {
            width:36px; height:36px; display:flex; align-items:center; justify-content:center;
            border-radius:50%; cursor:pointer; font-size:14px; font-weight:500;
            background:var(--bg-card); border:2px solid var(--border-color);
            transition:all var(--transition);
            user-select:none;
        }
        .mini-calendar .day-option:hover { background:var(--border-color); }
        .mini-calendar .day-option.selected {
            background:var(--accent); color:#fff; border-color:var(--accent);
        }
        .mini-calendar .day-option.weekday-label {
            background:transparent; border:none; cursor:default; font-weight:600; color:var(--text-muted);
        }
        .mini-calendar .day-option.weekday-label:hover { background:transparent; }

        .user-table-wrap { overflow-x:auto; margin-top:12px; }
        .user-table { width:100%; border-collapse:collapse; font-size:14px; }
        .user-table th {
            text-align:left; padding:10px 12px; border-bottom:2px solid var(--border-color);
            color:var(--text-muted); font-weight:600; font-size:12px; text-transform:uppercase;
        }
        .user-table td { padding:10px 12px; border-bottom:1px solid var(--border-color); color:var(--text-secondary); }
        .user-table tr:hover td { background:var(--bg-input); }
        .user-table .role-badge {
            display:inline-block; padding:2px 12px; border-radius:20px;
            font-size:12px; font-weight:500;
        }
        .user-table .role-badge.admin { background:#4f6ef720; color:var(--accent); }

        /* ===== 移动端用户管理表格优化 ===== */
        @media (max-width: 768px) {
            .user-table thead { display:none; }
            .user-table, .user-table tbody, .user-table tr, .user-table td {
                display:block; width:100%;
            }
            .user-table tr {
                margin-bottom:12px;
                border:1px solid var(--border-color);
                border-radius:var(--radius-sm);
                padding:8px 12px;
                background:var(--bg-card);
            }
            .user-table td {
                border:none;
                padding:4px 0;
                display:flex;
                justify-content:space-between;
                align-items:center;
                flex-wrap:wrap;
            }
            .user-table td:before {

    <script>
        // ================================================================
        // JSONBin.io 配置（遵循官方 API 文档）
        // 参考: https://jsonbin.io/api-reference
        // ================================================================
        // 主钥匙 - 拥有所有权限，用于创建、更新、删除
        const MASTER_KEY = '$2a$10$sFmJWp8GqChHB2n8/Cg8gODPEbXEhGpXSbqTSKq8u.KVwnUSEY3I6';
        // 访问密钥 "GitHub" - 用于读取
        const ACCESS_KEY = '$2a$10$yc8kYQ4Q34qWJf5rwuGu0uT/m0HUVldwcH7pTPj7JcfuvUf4OcHZC';

        const BIN_API_BASE = 'https://api.jsonbin.io/v3/b';
        const BIN_ID_KEY = 'aiims_bin_id';

        // ================================================================
        // 默认数据（仅保留管理员）
        // ================================================================
        const DEFAULT_ROLES = [
            { id: 1, name: '管理员', level: 0 },
            { id: 2, name: '领导', level: 1 },
            { id: 3, name: '经理', level: 2 },
            { id: 4, name: '主管', level: 3 },
            { id: 5, name: '组长', level: 4 },
            { id: 6, name: '员工', level: 5 }
        ];
        const DEFAULT_USERS = [
            { id: 1, username: 'admin', password: 'admin123', email: 'admin@demo.com', roleId: 1 }
        ];
        const DEFAULT_TODOS = [];

        // ================================================================
        // 全局状态
        // ================================================================
        let roles = [], users = [], todos = [];
        let currentUser = null;
        let binId = localStorage.getItem(BIN_ID_KEY);
        let currentPage = 'dashboard';
        let calendarDate = new Date();
        let todoFilter = 'all', dashboardFilter = 'all', todoSearchTerm = '', dashboardRange = 3;

        // ================================================================
        // JSONBin API 操作（严格遵循官方文档）
        // 参考: https://jsonbin.io/api-reference/bins/create
        //       https://jsonbin.io/api-reference/bins/read
        //       https://jsonbin.io/api-reference/bins/update
        //       https://jsonbin.io/api-reference/bins/delete
        // ================================================================

        /**
         * 创建 Bin（首次使用时调用）
         * POST /b
         * Headers: Content-Type, X-Master-Key, X-Access-Key
         */
        async function createBin(data) {
            const resp = await fetch(BIN_API_BASE, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY,
                    'X-Access-Key': ACCESS_KEY
                },
                body: JSON.stringify(data)
            });
            if (!resp.ok) {
                const errText = await resp.text();
                throw new Error(`创建Bin失败 (${resp.status}): ${errText}`);
            }
            const result = await resp.json();
            return result.id; // 返回 Bin ID
        }

        /**
         * 读取 Bin
         * GET /b/<BIN_ID>?meta=false
         * Headers: X-Master-Key 或 X-Access-Key
         */
        async function readBin(binId) {
            const resp = await fetch(`${BIN_API_BASE}/${binId}?meta=false`, {
                headers: {
                    'X-Access-Key': ACCESS_KEY
                }
            });
            if (!resp.ok) {
                const errText = await resp.text();
                throw new Error(`读取Bin失败 (${resp.status}): ${errText}`);
            }
            return await resp.json();
        }

        /**
         * 更新 Bin（完全替换）
         * PUT /b/<BIN_ID>
         * Headers: Content-Type, X-Master-Key, X-Access-Key
         */
        async function updateBin(binId, data) {
            const resp = await fetch(`${BIN_API_BASE}/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY,
                    'X-Access-Key': ACCESS_KEY
                },
                body: JSON.stringify(data)
            });
            if (!resp.ok) {
                const errText = await resp.text();
                throw new Error(`更新Bin失败 (${resp.status}): ${errText}`);
            }
            return await resp.json();
        }

        /**
         * 删除 Bin
         * DELETE /b/<BIN_ID>
         * Headers: X-Master-Key, X-Access-Key
         */
        async function deleteBin(binId) {
            const resp = await fetch(`${BIN_API_BASE}/${binId}`, {
                method: 'DELETE',
                headers: {
                    'X-Master-Key': MASTER_KEY,
                    'X-Access-Key': ACCESS_KEY
                }
            });
            if (!resp.ok) {
                const errText = await resp.text();
                throw new Error(`删除Bin失败 (${resp.status}): ${errText}`);
            }
            return await resp.json();
        }

        // ================================================================
        // 数据加载与同步（使用上述 API）
        // ================================================================

        async function loadAllData() {
            try {
                if (!binId) {
                    // 首次使用：创建 Bin
                    const initialData = { roles: DEFAULT_ROLES, users: DEFAULT_USERS, todos: DEFAULT_TODOS };
                    binId = await createBin(initialData);
                    localStorage.setItem(BIN_ID_KEY, binId);
                    roles = DEFAULT_ROLES;
                    users = DEFAULT_USERS;
                    todos = DEFAULT_TODOS;
                    return true;
                }

                // 尝试读取现有 Bin
                try {
                    const data = await readBin(binId);
                    roles = data.roles || [];
                    users = data.users || [];
                    todos = data.todos || [];
                    // 确保管理员存在
                    ensureAdminExists();
                    // 如果角色为空，补全默认角色
                    if (roles.length === 0) {
                        roles = DEFAULT_ROLES;
                    }
                    // 确保所有用户有有效角色
                    const employeeRole = roles.find(r => r.name === '员工');
                    users.forEach(u => {
                        if (!roles.find(r => r.id === u.roleId)) {
                            u.roleId = employeeRole ? employeeRole.id : roles[0].id;
                        }
                    });
                    // 同步更新到云端（确保数据结构完整）
                    await syncAllData();
                    return true;
                } catch (readError) {
                    // 如果读取失败（如 Bin 被删除或 ID 无效），重新创建
                    console.warn('读取Bin失败，将重新创建:', readError.message);
                    localStorage.removeItem(BIN_ID_KEY);
                    binId = null;
                    // 递归调用重新创建
                    return loadAllData();
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                let msg = '加载数据失败，请检查：\n';
                if (error.message.includes('创建Bin失败') || error.message.includes('更新Bin失败')) {
                    msg += '1. 请确认主钥匙（MASTER_KEY）是否正确有效。\n';
                    msg += '2. 请确认访问密钥（ACCESS_KEY）是否正确有效。\n';
                    msg += '3. 可参考官方文档: https://jsonbin.io/api-reference\n';
                    msg += `错误详情: ${error.message}`;
                } else if (error.message.includes('fetch')) {
                    msg += '网络连接异常，请检查网络后刷新重试。';
                } else {
                    msg += error.message;
                }
                alert(msg);
                return false;
            }
        }

        function ensureAdminExists() {
            let adminRole = roles.find(r => r.name === '管理员');
            if (!adminRole) {
                adminRole = { id: getNextId(roles), name: '管理员', level: 0 };
                roles.push(adminRole);
            }
            const admin = users.find(u => u.roleId === adminRole.id);
            if (!admin) {
                users.push({
                    id: getNextId(users),
                    username: 'admin',
                    password: 'admin123',
                    email: 'admin@demo.com',
                    roleId: adminRole.id
                });
            }
        }

        function getNextId(collection) {
            if (!collection || collection.length === 0) return 1;
            return Math.max(...collection.map(item => item.id)) + 1;
        }

        async function syncAllData() {
            if (!binId) {
                // 如果没有 binId，创建新的
                const initialData = { roles, users, todos };
                binId = await createBin(initialData);
                localStorage.setItem(BIN_ID_KEY, binId);
                return;
            }
            try {
                await updateBin(binId, { roles, users, todos });
                console.log('数据已同步到 JSONBin.io');
            } catch (error) {
                console.error('同步失败:', error);
                // 如果更新失败（如 Bin 被删除），尝试重新创建
                if (error.message.includes('404') || error.message.includes('Not Found')) {
                    console.warn('Bin 不存在，尝试重新创建');
                    localStorage.removeItem(BIN_ID_KEY);
                    binId = null;
                    await syncAllData(); // 递归重新创建
                } else {
                    alert('数据保存失败，请检查网络或钥匙！\n' + error.message);
                }
            }
        }

        // ================================================================
        // 辅助函数
        // ================================================================
        function getRoleName(id) { const r = roles.find(x => x.id === id); return r ? r.name : '未知'; }
        function getRoleLevel(id) { const r = roles.find(x => x.id === id); return r ? r.level : 999; }
        function getUserById(id) { return users.find(u => u.id === id); }

        function canViewUserManagement(user) { return true; }

        function getVisibleUsers(currentUser) {
            if (!currentUser) return [];
            const userRole = roles.find(r => r.id === currentUser.roleId);
            if (!userRole) return [];
            if (userRole.name === '管理员' || userRole.name === '领导') {
                return users;
            } else {
                const myLevel = userRole.level;
                return users.filter(u => {
                    if (u.id === currentUser.id) return true;
                    const uRole = roles.find(r => r.id === u.roleId);
                    if (!uRole) return false;
                    return uRole.level > myLevel;
                });
            }
        }

        function canEditUser(editor, target) {
            if (!editor || !target) return false;
            const editorRole = roles.find(r => r.id === editor.roleId);
            if (!editorRole) return false;
            if (editorRole.name === '管理员') return true;
            return editor.id === target.id;
        }

        function canDeleteUser(editor, target) {
            if (!editor || !target) return false;
            if (editor.id === target.id) return false;
            const editorRole = roles.find(r => r.id === editor.roleId);
            if (!editorRole) return false;
            if (editorRole.name === '管理员') {
                const targetRole = roles.find(r => r.id === target.roleId);
                if (targetRole && targetRole.name === '管理员') return false;
                return true;
            }
            return false;
        }

        function canViewTodo(user, todo) {
            if (!user) return false;
            const userRole = roles.find(r => r.id === user.roleId);
            const creator = getUserById(todo.createdBy);
            if (!creator) return false;
            if (userRole.name === '管理员' || userRole.name === '领导') return true;
            const creatorRole = roles.find(r => r.id === creator.roleId);
            if (!creatorRole) return false;
            if (creator.id === user.id) return true;
            return userRole.level <= creatorRole.level;
        }

        function canModifyTodo(user, todo) {
            if (!user) return false;
            const userRole = roles.find(r => r.id === user.roleId);
            if (userRole.name === '管理员') return true;
            if (userRole.name === '领导') return todo.createdBy === user.id;
            return todo.createdBy === user.id;
        }

        function canManageRoles(user) {
            if (!user) return false;
            const role = roles.find(r => r.id === user.roleId);
            return role && role.name === '管理员';
        }

        function formatDate(d) { if(!d) return ''; const dt=new Date(d); return dt.toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
        function formatDateShort(d) { if(!d) return ''; const dt=new Date(d); return dt.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
        function formatDateOnly(d) { if(!d) return ''; const dt=new Date(d); return dt.toLocaleDateString('zh-CN'); }
        function getUrgencyLabel(u) { return { 'urgent':'紧急','important':'重要','general':'一般' }[u]||u; }
        function getRepeatLabel(todo) {
            const map = { 'once':'一次性','daily':'每天','weekly':'每周','monthly':'每月' };
            let label = map[todo.repeatType]||'一次性';
            if (todo.repeatType === 'weekly' && todo.repeatDays && todo.repeatDays.length) {
                label += ' (' + todo.repeatDays.map(d => '周'+['日','一','二','三','四','五','六'][d]).join(',') + ')';
            }
            if (todo.repeatType === 'monthly' && todo.repeatDays && todo.repeatDays.length) {
                label += ' (' + todo.repeatDays.join(',') + '日)';
            }
            return label;
        }
        function getReminderLabel(todo) {
            if (!todo.reminderOffset) return '不提醒';
            const unitMap = { 'minute':'分钟','hour':'小时','day':'天' };
            return `提前 ${todo.reminderOffset}${unitMap[todo.reminderUnit]||''}`;
        }
        function daysInMonth(year, month) { return new Date(year, month+1, 0).getDate(); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        // 跳转函数

        function renderStats() {

        function renderCalendar(year, month) {
            const grid = document.getElementById('calendar-grid');
            const label = document.getElementById('calendar-month-label');
            const firstDay = new Date(year, month, 1).getDay();
            const days = daysInMonth(year, month);
            const today = new Date();
            const todayDate = today.getDate(), todayMonth = today.getMonth(), todayYear = today.getFullYear();
            label.textContent = `${year}年${month+1}月`;
            let html = '';
            const weekDays = ['日','一','二','三','四','五','六'];
            weekDays.forEach(w => html += `<div class="day-label">${w}</div>`);

            for (let i = 0; i < firstDay; i++) {
                html += `<div class="day-cell" style="opacity:0.3;"></div>`;
            }

            const visibleTodos = todos.filter(t => canViewTodo(currentUser, t) && !t.completed);
            for (let d = 1; d <= days; d++) {
                const isToday = (d === todayDate && month === todayMonth && year === todayYear);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

                const dayTodos = visibleTodos.filter(t => {
                    const start = new Date(t.startTime);
                    const end = new Date(t.endTime);
                    const check = new Date(year, month, d);
                    const startDate = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                    const endDate = new Date(end.getFullYear(), end.getMonth(), end.getDate());
                    return check >= startDate && check <= endDate;
                });

                const urgentCount = dayTodos.filter(t => t.urgency === 'urgent').length;
                const importantCount = dayTodos.filter(t => t.urgency === 'important').length;
                const generalCount = dayTodos.filter(t => t.urgency === 'general').length;

                let badgeClass = '';
                let badgeText = '';
                if (dayTodos.length > 0) {
                    if (urgentCount > 0) {
                        badgeClass = 'urgent-badge';
                        badgeText = urgentCount;
                    } else if (importantCount > 0) {
                        badgeClass = 'important-badge';
                        badgeText = importantCount;
                    } else if (generalCount > 0) {
                        badgeClass = 'general-badge';
                        badgeText = generalCount;
                    }
                    if (dayTodos.length > 1 && urgentCount > 0 && importantCount > 0) {
                        badgeClass = 'mixed-badge';
                        badgeText = dayTodos.length;
                    }
                }

                let dayClass = 'day-cell';
                if (!isToday) dayClass += ' other-month';
                if (isToday) dayClass += ' today';
                if (dayTodos.length > 0) {
                    dayClass += ' has-todo';
                    if (urgentCount > 0) dayClass += ' urgent-day';
                    else if (importantCount > 0) dayClass += ' important-day';
                }

                html += `<div class="${dayClass}" data-date="${dateStr}" data-todos="${dayTodos.length}">
                            <span class="day-num">${d}</span>
                            ${badgeText ? `<span class="day-badge ${badgeClass}">${badgeText}</span>` : ''}
                        </div>`;
            }
            grid.innerHTML = html;

            grid.querySelectorAll('.day-cell[data-date]').forEach(el => {
                el.addEventListener('click', function() {
                    const date = this.dataset.date;
                    showDayTodos(date);
                });
            });
        }

        function showDayTodos(dateStr) {
            const visible = todos.filter(t => canViewTodo(currentUser, t) && !t.completed);
            const [year, month, day] = dateStr.split('-').map(Number);
            const dayTodos = visible.filter(t => {
                const start = new Date(t.startTime);
                const end = new Date(t.endTime);
                const check = new Date(year, month-1, day);
                const startDate = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                const endDate = new Date(end.getFullYear(), end.getMonth(), end.getDate());
                return check >= startDate && check <= endDate;
            });
            const container = document.getElementById('calendar-day-todos');
            if (dayTodos.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted);font-size:14px;">📭 该日暂无待办事项</p>`;
                return;
            }
            let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
            dayTodos.forEach(t => {
                const color = t.urgency === 'urgent' ? 'var(--urgent-color)' : t.urgency === 'important' ? 'var(--important-color)' : 'var(--general-color)';
                html += `<div class="todo-item-clickable" data-todo-id="${t.id}" style="border-left-color:${color};">
                            <span style="font-weight:500;">${t.title}</span>
                            <span style="font-size:12px;color:var(--text-muted);">${formatDateShort(t.startTime)} - ${formatDateShort(t.endTime)}</span>
                            <span class="todo-urgency ${t.urgency}" style="font-size:10px;">${getUrgencyLabel(t.urgency)}</span>
                            <span class="click-hint"><i class="fas fa-arrow-right"></i> 跳转</span>
                        </div>`;
            });
            html += '</div>';
            container.innerHTML = html;

            container.querySelectorAll('.todo-item-clickable').forEach(el => {
                el.addEventListener('click', function() {
                    const todoId = parseInt(this.dataset.todoId);
                    const todo = todos.find(t => t.id === todoId);
                    if (todo) {
                        const dateStr = formatDateOnly(todo.startTime);
                        navigateToTodosWithFilter('all', dateStr);
                    }
                });
            });
        }

        function renderTodoList(containerId, filter='all', showActions=true, search='', rangeDays=null) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let list = todos.filter(t => canViewTodo(currentUser, t));

            if (search) {
                const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                if (dateRegex.test(search)) {
                    const [y, m, d] = search.split('-').map(Number);
                    list = list.filter(t => {
                        const start = new Date(t.startTime);
                        const check = new Date(y, m-1, d);
                        const startDate = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                        return startDate.getTime() === check.getTime();
                    });
                } else {
                    const s = search.toLowerCase();
                    list = list.filter(t => t.title.toLowerCase().includes(s));
                }
            }

            if (rangeDays !== null && rangeDays > 0) {
                const now = new Date();
                const limit = new Date(now); limit.setDate(limit.getDate() + rangeDays);
                list = list.filter(t => {
                    const start = new Date(t.startTime);
                    return start >= now && start <= limit && !t.completed;
                });
            }

            if (filter === 'urgent') list = list.filter(t => t.urgency === 'urgent' && !t.completed);
            else if (filter === 'important') list = list.filter(t => t.urgency === 'important' && !t.completed);
            else if (filter === 'general') list = list.filter(t => t.urgency === 'general' && !t.completed);
            else if (filter === 'done') list = list.filter(t => t.completed);
            else if (filter === 'pending') list = list.filter(t => !t.completed);
            else if (filter === 'today') {
                const today = new Date();
                list = list.filter(t => {
                    const start = new Date(t.startTime);
                    return start.getFullYear() === today.getFullYear() &&
                           start.getMonth() === today.getMonth() &&
                           start.getDate() === today.getDate() &&
                           !t.completed;
                });
            } else list = list.filter(t => !t.completed);

            const order = { 'urgent':0, 'important':1, 'general':2 };
            list.sort((a,b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                if (order[a.urgency] !== order[b.urgency]) return order[a.urgency] - order[b.urgency];
                return new Date(a.startTime) - new Date(b.startTime);
            });

            if (list.length === 0) {
                container.innerHTML = `<div class="todo-empty"><i class="fas fa-inbox"></i><p>暂无待办事项</p></div>`;
                return;
            }

            let html = '';
            list.forEach(todo => {
                const steps = todo.steps || [];
                const currentStep = todo.currentStep || 0;
                const progress = steps.length > 0 ? Math.round((currentStep / steps.length) * 100) : 0;
                const isDone = todo.completed;

                html += `<div class="todo-item" data-id="${todo.id}">
                            <button class="todo-check ${isDone ? 'done' : ''}" data-id="${todo.id}">
                                ${isDone ? '<i class="fas fa-check"></i>' : ''}
                            </button>
                            <div class="todo-body">
                                <div class="todo-title" style="${isDone ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${todo.title}</div>
                                <div class="todo-meta">
                                    <span><i class="far fa-calendar"></i> ${formatDate(todo.startTime)} - ${formatDate(todo.endTime)}</span>
                                    <span><i class="fas fa-repeat"></i> ${getRepeatLabel(todo)}</span>
                                    <span><i class="fas fa-bell"></i> ${getReminderLabel(todo)}</span>
                                    <span><i class="fas fa-user"></i> ${(getUserById(todo.createdBy)||{}).username || '未知'}</span>
                                    ${steps.length ? `<span><i class="fas fa-list-ul"></i> ${currentStep+1}/${steps.length} 步</span>` : ''}
                                    ${todo.autoDeleteDays ? `<span><i class="fas fa-clock"></i> ${todo.autoDeleteDays}天后删</span>` : ''}
                                </div>
                            </div>
                            <div class="todo-urgency ${todo.urgency}">${getUrgencyLabel(todo.urgency)}</div>
                            <div class="todo-progress">
                                <span>${isDone ? '✅ 完成' : `${progress}%`}</span>
                                <div class="progress-bar"><div class="fill ${todo.urgency}" style="width:${isDone ? 100 : progress}%;"></div></div>
                            </div>
                            ${showActions && canModifyTodo(currentUser, todo) ? `
                            <div class="todo-actions">
                                <button class="edit-btn" data-id="${todo.id}"><i class="fas fa-edit"></i></button>
                                <button class="delete-btn" data-id="${todo.id}"><i class="fas fa-trash"></i></button>
                            </div>` : ''}
                        </div>`;
            });
            container.innerHTML = html;

            container.querySelectorAll('.todo-check').forEach(btn => {
                btn.addEventListener('click', function() { toggleTodoComplete(parseInt(this.dataset.id)); });
            });
            container.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() { openTodoModal(parseInt(this.dataset.id)); });
            });
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (confirm('确定删除此待办？')) deleteTodo(parseInt(this.dataset.id));
                });
            });
        }
