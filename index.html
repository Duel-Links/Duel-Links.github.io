        // ================================================================
        // CRUD 操作
        // ================================================================
        async function toggleTodoComplete(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo || !canModifyTodo(currentUser, todo)) return;
            todo.completed = !todo.completed;
            todo.completedAt = todo.completed ? new Date().toISOString() : null;
            await syncAllData();
            refreshAll();
        }

        async function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            await syncAllData();
            refreshAll();
        }

        async function deleteUser(id) {
            if (id === currentUser.id) { alert('不能删除自己'); return; }
            const target = users.find(u => u.id === id);
            if (!target) return;
            const targetRole = roles.find(r => r.id === target.roleId);
            if (targetRole && targetRole.name === '管理员') { alert('不能删除管理员'); return; }
            users = users.filter(u => u.id !== id);
            await syncAllData();
            refreshAll();
        }

        async function deleteRole(id) {
            const adminRole = roles.find(r => r.name === '管理员');
            if (id === adminRole.id) { alert('不能删除管理员角色'); return; }
            if (users.find(u => u.roleId === id)) { alert('有用户使用该角色，无法删除'); return; }
            roles = roles.filter(r => r.id !== id);
            await syncAllData();
            refreshAll();
        }

        // ================================================================
        // 重复选择器（迷你日历）
        // ================================================================
        function renderRepeatPicker(repeatType, selectedDays) {
            const container = document.getElementById('repeat-picker');
            container.innerHTML = '';
            if (repeatType === 'daily') {
                container.innerHTML = '<div style="padding:8px;color:var(--text-muted);">每天重复（无需选择具体日期）</div>';
                return;
            } else if (repeatType === 'weekly') {
                const weekdays = ['日','一','二','三','四','五','六'];
                const sel = selectedDays || [];
                const wrap = document.createElement('div');
                wrap.className = 'mini-calendar';
                weekdays.forEach((name, idx) => {
                    const div = document.createElement('div');
                    div.className = 'day-option';
                    div.textContent = name;
                    if (sel.includes(idx)) div.classList.add('selected');
                    div.dataset.value = idx;
                    div.addEventListener('click', function() {
                        this.classList.toggle('selected');
                    });
                    wrap.appendChild(div);
                });
                container.appendChild(wrap);
            } else if (repeatType === 'monthly') {
                const sel = selectedDays || [];
                const wrap = document.createElement('div');
                wrap.className = 'mini-calendar';
                for (let i = 1; i <= 31; i++) {
                    const div = document.createElement('div');
                    div.className = 'day-option';
                    div.textContent = i;
                    if (sel.includes(i)) div.classList.add('selected');
                    div.dataset.value = i;
                    div.addEventListener('click', function() {
                        this.classList.toggle('selected');
                    });
                    wrap.appendChild(div);
                }
                container.appendChild(wrap);
            }
        }

        function getSelectedDays() {
            const container = document.getElementById('repeat-picker');
            const selected = [];
            container.querySelectorAll('.day-option.selected').forEach(el => {
                selected.push(parseInt(el.dataset.value));
            });
            return selected;
        }

        // ================================================================
        // 表单操作
        // ================================================================
        function openTodoModal(id) {
            const modal = document.getElementById('todo-modal');
            document.getElementById('todo-id').value = '';
            document.getElementById('todo-modal-title').textContent = '新建待办';
            document.getElementById('todo-form').reset();
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            ['步骤1','步骤2','步骤3'].forEach(s => addStepInput(s));
            document.getElementById('repeat-selector').style.display = 'none';
            document.getElementById('repeat-picker').innerHTML = '';

            if (id) {
                const todo = todos.find(t => t.id === id);
                if (!todo || !canModifyTodo(currentUser, todo)) { alert('无权限编辑'); return; }
                document.getElementById('todo-modal-title').textContent = '编辑待办';
                document.getElementById('todo-id').value = id;
                document.getElementById('todo-title').value = todo.title;
                document.getElementById('todo-urgency').value = todo.urgency;
                document.getElementById('todo-repeat').value = todo.repeatType || 'once';
                document.getElementById('todo-start').value = todo.startTime ? todo.startTime.slice(0,16) : '';
                document.getElementById('todo-end').value = todo.endTime ? todo.endTime.slice(0,16) : '';
                document.getElementById('todo-auto-delete').value = todo.autoDeleteDays || 3;
                document.getElementById('todo-reminder-offset').value = todo.reminderOffset || 0;
                document.getElementById('todo-reminder-unit').value = todo.reminderUnit || 'minute';
                container.innerHTML = '';
                (todo.steps || []).forEach(s => addStepInput(s));
                if (todo.steps.length === 0) addStepInput('');
                const repeat = todo.repeatType;
                if (repeat !== 'once') {
                    document.getElementById('repeat-selector').style.display = 'block';
                    const label = document.getElementById('repeat-label');
                    if (repeat === 'daily') label.textContent = '每天重复';
                    else if (repeat === 'weekly') label.textContent = '选择每周重复日（点击切换）';
                    else if (repeat === 'monthly') label.textContent = '选择每月重复日（点击切换）';
                    renderRepeatPicker(repeat, todo.repeatDays || []);
                }
            } else {
                const now = new Date();
                const start = new Date(now); start.setHours(start.getHours()+1); start.setMinutes(0,0,0);
                const end = new Date(start); end.setHours(end.getHours()+1);
                document.getElementById('todo-start').value = start.toISOString().slice(0,16);
                document.getElementById('todo-end').value = end.toISOString().slice(0,16);
                document.getElementById('todo-auto-delete').value = 3;
                document.getElementById('todo-reminder-offset').value = 10;
            }
            modal.classList.add('show');
        }

        document.getElementById('todo-repeat').addEventListener('change', function() {
            const repeat = this.value;
            const selector = document.getElementById('repeat-selector');
            const label = document.getElementById('repeat-label');
            if (repeat === 'once') {
                selector.style.display = 'none';
                return;
            }
            selector.style.display = 'block';
            if (repeat === 'daily') label.textContent = '每天重复（无需选择）';
            else if (repeat === 'weekly') label.textContent = '选择每周重复日（点击切换）';
            else if (repeat === 'monthly') label.textContent = '选择每月重复日（点击切换）';
            renderRepeatPicker(repeat, []);
        });

        function addStepInput(value='') {
            const container = document.getElementById('steps-container');
            const div = document.createElement('div');
            div.className = 'step-input-group';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'step-input';
            input.value = value;
            input.placeholder = '输入步骤';
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.innerHTML = '<i class="fas fa-times"></i>';
            delBtn.addEventListener('click', function() {
                if (container.children.length > 1) container.removeChild(div);
            });
            div.appendChild(input);
            div.appendChild(delBtn);
            container.appendChild(div);
        }

        function getStepsFromUI() {
            const inputs = document.querySelectorAll('#steps-container .step-input');
            return Array.from(inputs).map(inp => inp.value.trim()).filter(s => s);
        }

        async function saveTodoFromForm() {
            const id = document.getElementById('todo-id').value;
            const title = document.getElementById('todo-title').value.trim();
            if (!title) { alert('请输入事项名称'); return; }
            const urgency = document.getElementById('todo-urgency').value;
            const repeatType = document.getElementById('todo-repeat').value;
            const startTime = document.getElementById('todo-start').value;
            const endTime = document.getElementById('todo-end').value;
            const steps = getStepsFromUI();
            const autoDeleteDays = parseInt(document.getElementById('todo-auto-delete').value) || 0;
            const reminderOffset = parseInt(document.getElementById('todo-reminder-offset').value) || 0;
            const reminderUnit = document.getElementById('todo-reminder-unit').value;

            let repeatDays = [];
            if (repeatType === 'weekly' || repeatType === 'monthly') {
                repeatDays = getSelectedDays();
            }

            const todoData = {
                title,
                urgency,
                steps: steps.length ? steps : ['步骤1','步骤2','步骤3'],
                startTime: startTime || new Date().toISOString(),
                endTime: endTime || new Date(Date.now()+3600000).toISOString(),
                repeatType,
                repeatDays,
                autoDeleteDays,
                reminderOffset,
                reminderUnit,
                currentStep: 0,
                completed: false,
                completedAt: null,
                createdBy: currentUser.id,
                createdAt: new Date().toISOString()
            };
            if (id) {
                const existing = todos.find(t => t.id === parseInt(id));
                if (!existing || !canModifyTodo(currentUser, existing)) { alert('无权限修改'); return; }
                Object.assign(existing, todoData);
            } else {
                todoData.id = getNextId(todos);
                todos.push(todoData);
            }
            await syncAllData();
            closeModal('todo-modal');
            refreshAll();
        }

        function openUserModal(id) {
            const modal = document.getElementById('user-modal');
            document.getElementById('user-id').value = '';
            document.getElementById('user-modal-title').textContent = '添加用户';
            document.getElementById('user-form').reset();
            const roleSelect = document.getElementById('user-role');
            roleSelect.innerHTML = roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');

            if (id) {
                const user = users.find(u => u.id === id);
                if (!user) return;
                document.getElementById('user-modal-title').textContent = '编辑用户';
                document.getElementById('user-id').value = id;
                document.getElementById('user-username').value = user.username;
                document.getElementById('user-password').value = user.password;
                document.getElementById('user-email').value = user.email || '';
                roleSelect.value = user.roleId;
                if (currentUser.id === id && roles.find(r => r.id === currentUser.roleId)?.name === '管理员') {
                    roleSelect.disabled = true;
                } else {
                    roleSelect.disabled = false;
                }
            } else {
                roleSelect.disabled = false;
            }
            modal.classList.add('show');
        }

        async function saveUserFromForm() {
            const id = document.getElementById('user-id').value;
            const username = document.getElementById('user-username').value.trim();
            const password = document.getElementById('user-password').value.trim();
            const email = document.getElementById('user-email').value.trim();
            const roleId = parseInt(document.getElementById('user-role').value);
            if (!username || !password) { alert('用户名和密码不能为空'); return; }
            if (id) {
                const user = users.find(u => u.id === parseInt(id));
                if (!user) return;
                if (user.roleId !== roleId) {
                    const adminRole = roles.find(r => r.name === '管理员');
                    if (currentUser.id === user.id && adminRole && user.roleId === adminRole.id) {
                        alert('不能修改自己的管理员角色');
                        return;
                    }
                    if (adminRole && roleId === adminRole.id && !canManageRoles(currentUser)) {
                        alert('无权将用户设置为管理员');
                        return;
                    }
                }
                Object.assign(user, { username, password, email, roleId });
            } else {
                if (users.find(u => u.username === username)) { alert('用户名已存在'); return; }
                const adminRole = roles.find(r => r.name === '管理员');
                if (adminRole && roleId === adminRole.id && !canManageRoles(currentUser)) {
                    alert('只有管理员才能创建管理员用户');
                    return;
                }
                users.push({ id: getNextId(users), username, password, email, roleId });
            }
            await syncAllData();
            closeModal('user-modal');
            refreshAll();
        }

        function openRoleModal(id) {
            const modal = document.getElementById('role-modal');
            document.getElementById('role-id').value = '';
            document.getElementById('role-modal-title').textContent = '添加角色';
            document.getElementById('role-form').reset();
            if (id) {
                const role = roles.find(r => r.id === id);
                if (!role) return;
                document.getElementById('role-modal-title').textContent = '编辑角色';
                document.getElementById('role-id').value = id;
                document.getElementById('role-name').value = role.name;
                document.getElementById('role-level').value = role.level;
            }
            modal.classList.add('show');
        }

        async function saveRoleFromForm() {
            const id = document.getElementById('role-id').value;
            const name = document.getElementById('role-name').value.trim();
            const level = parseInt(document.getElementById('role-level').value) || 0;
            if (!name) { alert('角色名不能为空'); return; }
            const adminRole = roles.find(r => r.name === '管理员');
            if (id) {
                const role = roles.find(r => r.id === parseInt(id));
                if (!role) return;
                if (role.id === adminRole.id) { alert('不能修改管理员角色'); return; }
                Object.assign(role, { name, level });
            } else {
                if (roles.find(r => r.name === name)) { alert('角色名已存在'); return; }
                roles.push({ id: getNextId(roles), name, level });
            }
            await syncAllData();
            closeModal('role-modal');
            refreshAll();
        }

        function openProfileModal() {
            const modal = document.getElementById('profile-modal');
            document.getElementById('profile-username').value = currentUser.username;
            document.getElementById('profile-password').value = currentUser.password;
            document.getElementById('profile-email').value = currentUser.email || '';
            modal.classList.add('show');
        }

        async function saveProfileFromForm() {
            const username = document.getElementById('profile-username').value.trim();
            const password = document.getElementById('profile-password').value.trim();
            const email = document.getElementById('profile-email').value.trim();
            if (!username || !password) { alert('用户名和密码不能为空'); return; }
            const user = users.find(u => u.id === currentUser.id);
            if (user) {
                Object.assign(user, { username, password, email });
                await syncAllData();
                currentUser = { ...user, password: undefined };
                localStorage.setItem('session', JSON.stringify({ userId: currentUser.id }));
                closeModal('profile-modal');
                refreshAll();
            }
        }

        // ================================================================
        // 自动清理过期待办
        // ================================================================
        async function autoCleanup() {
            const now = new Date();
            const toRemove = [];
            todos.forEach(todo => {
                if (!canModifyTodo(currentUser, todo)) return;
                let shouldDelete = false;
                if (todo.completed && todo.completedAt) {
                    const delDate = new Date(todo.completedAt);
                    delDate.setDate(delDate.getDate() + (todo.autoDeleteDays || 3));
                    if (now > delDate) shouldDelete = true;
                } else if (!todo.completed) {
                    const endDate = new Date(todo.endTime);
                    const delDate = new Date(endDate);
                    delDate.setDate(delDate.getDate() + (todo.autoDeleteDays || 3));
                    if (now > delDate) shouldDelete = true;
                }
                if (shouldDelete) toRemove.push(todo.id);
            });
            if (toRemove.length > 0) {
                todos = todos.filter(t => !toRemove.includes(t.id));
                await syncAllData();
                refreshAll();
            }
        }

        // ================================================================
        // 刷新与导航
        // ================================================================
        function refreshAll() {
            renderSidebar();
            renderStats();
            renderTodoList('dashboard-todo-list', dashboardFilter, true, '', dashboardRange);
            renderTodoList('todo-list', todoFilter, true, todoSearchTerm);
            renderCalendar(calendarDate.getFullYear(), calendarDate.getMonth());
            renderUserTable();
            if (canManageRoles(currentUser)) renderRoleTable();
            const titles = { 'dashboard':'主页', 'todos':'待办事项', 'calendar':'日历', 'users':'用户管理', 'roles':'角色管理' };
            document.getElementById('page-title').textContent = titles[currentPage] || '主页';
            document.querySelectorAll('.sidebar .nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === currentPage);
            });
            document.querySelectorAll('.page-section').forEach(el => {
                el.classList.toggle('active', el.id === 'page-' + currentPage);
            });
            if (currentPage === 'todos') {
                document.querySelectorAll('#todo-filters .filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === todoFilter);
                });
                if (todoSearchTerm && /^\d{4}-\d{2}-\d{2}$/.test(todoSearchTerm)) {
                    document.getElementById('todo-search').value = todoSearchTerm;
                }
            }
        }

        function navigateTo(page) {
            if (page === 'roles' && !canManageRoles(currentUser)) return;
            currentPage = page;
            refreshAll();
            if (page === 'calendar') {
                const today = new Date();
                const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                showDayTodos(dateStr);
            }
        }

        // ================================================================
        // 初始化
        // ================================================================
        function initApp() {
            if (!currentUser) return;
            renderSidebar();
            const now = new Date();
            calendarDate = new Date(now.getFullYear(), now.getMonth(), 1);
            refreshAll();
            const today = new Date();
            const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            showDayTodos(dateStr);
            const roleSelect = document.getElementById('user-role');
            roleSelect.innerHTML = roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            setInterval(autoCleanup, 600000);
        }

        // ================================================================
        // 启动
        // ================================================================
        (async function start() {
            try {
                const ok = await loadAllData();
                document.getElementById('loading-overlay').style.display = 'none';
                if (!ok) {
                    document.getElementById('login-page').style.display = 'flex';
                    document.getElementById('main-app').style.display = 'none';
                    return;
                }
                if (!restoreSession()) {
                    document.getElementById('login-page').style.display = 'flex';
                    document.getElementById('main-app').style.display = 'none';
                } else {
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('loading-overlay').innerHTML = '加载失败，请刷新重试';
                console.error(e);
            }
        })();

        // ================================================================
        // 事件绑定
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Login
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value.trim();
                const errEl = document.getElementById('login-error');
                if (login(username, password)) {
                    errEl.textContent = '';
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    initApp();
                } else {
                    errEl.textContent = '❌ 用户名或密码错误';
                }
            });

            document.getElementById('logout-btn').addEventListener('click', logout);

            // Theme
            document.getElementById('theme-toggle').addEventListener('click', function() {
                const html = document.documentElement;
                if (html.getAttribute('data-theme') === 'dark') {
                    html.removeAttribute('data-theme');
                    this.innerHTML = '<i class="fas fa-moon"></i>';
                } else {
                    html.setAttribute('data-theme', 'dark');
                    this.innerHTML = '<i class="fas fa-sun"></i>';
                }
            });

            // Navigation
            document.querySelectorAll('.sidebar .nav-item').forEach(el => {
                el.addEventListener('click', function() {
                    navigateTo(this.dataset.page);
                });
            });

            // 主页统计卡片点击跳转
            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    if (filter) {
                        navigateToTodosWithFilter(filter);
                    }
                });
            });

            // 主页筛选按钮点击跳转
            document.querySelectorAll('#dashboard-filters .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    document.querySelectorAll('#dashboard-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    dashboardFilter = filter;
                    renderTodoList('dashboard-todo-list', dashboardFilter, true, '', dashboardRange);
                    navigateToTodosWithFilter(filter);
                });
            });

            // Add buttons
            document.getElementById('btn-add-todo').addEventListener('click', () => openTodoModal(null));
            document.getElementById('btn-add-user').addEventListener('click', () => openUserModal(null));
            document.getElementById('btn-add-role').addEventListener('click', () => openRoleModal(null));
            document.getElementById('btn-edit-profile').addEventListener('click', openProfileModal);

            // Modal close
            document.querySelectorAll('[data-modal-close]').forEach(el => {
                el.addEventListener('click', function() {
                    const modal = this.closest('.modal-overlay');
                    if (modal) modal.classList.remove('show');
                });
            });
            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('show');
                });
            });

            // Forms
            document.getElementById('todo-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveTodoFromForm();
            });
            document.getElementById('user-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveUserFromForm();
            });
            document.getElementById('role-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveRoleFromForm();
            });
            document.getElementById('profile-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveProfileFromForm();
            });

            document.getElementById('add-step-btn').addEventListener('click', () => addStepInput(''));

            // Dashboard range
            document.getElementById('dashboard-range').addEventListener('change', function() {
                dashboardRange = parseInt(this.value);
                renderTodoList('dashboard-todo-list', dashboardFilter, true, '', dashboardRange);
            });

            // Search
            document.getElementById('todo-search').addEventListener('input', function() {
                todoSearchTerm = this.value;
                renderTodoList('todo-list', todoFilter, true, todoSearchTerm);
            });

            // 待办页面筛选
            document.querySelectorAll('#todo-filters .filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#todo-filters .filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    todoFilter = this.dataset.filter;
                    if (todoFilter !== 'all' && /^\d{4}-\d{2}-\d{2}$/.test(todoSearchTerm)) {
                        todoSearchTerm = '';
                        document.getElementById('todo-search').value = '';
                    }
                    renderTodoList('todo-list', todoFilter, true, todoSearchTerm);
                });
            });

            // Calendar nav
            function changeMonth(delta) {
                calendarDate.setMonth(calendarDate.getMonth() + delta);
                refreshAll();
            }
            document.getElementById('cal-prev').addEventListener('click', () => changeMonth(-1));
            document.getElementById('cal-next').addEventListener('click', () => changeMonth(1));
            document.getElementById('cal-today').addEventListener('click', function() {
                const now = new Date();
                calendarDate = new Date(now.getFullYear(), now.getMonth(), 1);
                refreshAll();
                const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
                showDayTodos(dateStr);
            });

            console.log('✅ AI-IMS 已启动 (数据存储在 JSONBin.io)');
            console.log('📖 API 参考: https://jsonbin.io/api-reference');
        });
    </script>
