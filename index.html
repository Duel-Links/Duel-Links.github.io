<script>
// ================================================================

const CONFIG = {

// ================================================================
// DOM 引用
// ================================================================
const $ = id => document.getElementById(id);
const connectionStatus = $('connectionStatus');
const btnReconnect = $('btnReconnect');
const btnDisconnect = $('btnDisconnect');
const newUsername = $('newUsername');
const newUserTickets = $('newUserTickets');
const btnAddUser = $('btnAddUser');
const btnClearAll = $('btnClearAll');
const userTableBody = $('userTableBody');
const logArea = $('logArea');

// ================================================================
// 数据层 (localStorage)
// ================================================================
const STORAGE_KEY = 'ticket_system_data';

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const data = JSON.parse(raw);
            if (typeof data.users === 'object' && data.users !== null) return data;
        }
    } catch (e) {}
    return { users: {} };
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getUsers() { return loadData().users; }
function setUsers(users) { const data = loadData(); data.users = users; saveData(data); }

function updateTickets(username, delta, reason = '') {
    const users = getUsers();
    if (!(username in users)) users[username] = 0;
    users[username] = Math.max(0, users[username] + delta);
    setUsers(users);
    const sign = delta >= 0 ? '+' : '';
    addLog(`${username} ${sign}${delta} 票 (${reason}) → 剩余 ${users[username]} 票`, 'ok');
    renderUserList();
    return users[username];
}
function removeUser(username) {
    if (!confirm(`确定删除用户 "${username}" 吗？`)) return;
    const users = getUsers();
    delete users[username];
    setUsers(users);
    addLog(`删除用户: ${username}`, 'warn');
    renderUserList();
}

// ================================================================
// 日志
// ================================================================
function addLog(message, type = 'info') {
    const time = new Date().toLocaleString('zh-CN', { hour12: false });
    const cls = { info: '', ok: 'log-ok', warn: 'log-warn', err: 'log-err' }[type] || '';
    const entry = document.createElement('div');
    entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${message}</span>`;
    logArea.appendChild(entry);
    while (logArea.children.length > 200) logArea.removeChild(logArea.firstChild);
    logArea.scrollTop = logArea.scrollHeight;
}

// ================================================================
// 渲染用户列表
// ================================================================
function renderUserList() {
    const users = getUsers();
    const entries = Object.entries(users);
    if (entries.length === 0) {
        userTableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">暂无用户，请添加</td></tr>`;
        return;
    }
    entries.sort((a, b) => b[1] - a[1]);
    let html = '';
    for (const [name, tickets] of entries) {
        const safeName = name.replace(/'/g, "\\'");
        html += `
            <tr>
                <td><strong>${escapeHtml(name)}</strong></td>
                <td style="text-align:center;"><span class="ticket-num">${tickets}</span></td>
                <td style="text-align:right;">
                    <button class="btn-sm green" data-action="add" data-user="${safeName}" data-amount="10">+10</button>
                    <button class="btn-sm blue" data-action="add" data-user="${safeName}" data-amount="1">+1</button>
                    <button class="btn-sm red" data-action="sub" data-user="${safeName}" data-amount="1">-1</button>
                    <button class="btn-sm red" data-action="sub" data-user="${safeName}" data-amount="10">-10</button>
                    <button class="btn-sm" style="background:#b2bec3;color:#2d3436;" data-action="del" data-user="${safeName}">删除</button>
                </td>
            </tr>
        `;
    }
    userTableBody.innerHTML = html;
    userTableBody.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            const user = btn.dataset.user;
            const amount = parseInt(btn.dataset.amount) || 0;
            if (action === 'add') updateTickets(user, amount, '手动加票');
            else if (action === 'sub') updateTickets(user, -amount, '手动扣票');
            else if (action === 'del') removeUser(user);
        });
    });
}
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

// ================================================================
// 弹幕处理
// ================================================================
function processDanmu(username, content) {
    if (!username || !content) return;
    const match = content.match(/^[-－](\d+)\s*[张张]?票$/);
    if (!match) return;
    const amount = parseInt(match[1]);
    if (isNaN(amount) || amount <= 0) return;
    const users = getUsers();
    if (!(username in users)) {
        users[username] = 0;
        setUsers(users);
        addLog(`🔹 自动创建新用户: ${username}`, 'info');
        renderUserList();
    }
    updateTickets(username, -amount, `弹幕: ${content}`);
}

// ================================================================
// 原生 WebSocket 连接 B站弹幕服务器
// ================================================================
let ws = null;
let wsHeartbeatTimer = null;
let isConnected = false;

/**
 * 获取直播间真实房间号和 token
 */
async function getRoomInfo(roomId) {
    // 第一步：获取真实房间号（长号）
    const initRes = await fetch(`https://api.live.bilibili.com/room/v1/Room/room_init?id=${roomId}`);
    const initData = await initRes.json();
    if (initData.code !== 0) throw new Error(`获取房间信息失败: ${initData.message}`);
    const realRoomId = initData.data.room_id;

    // 第二步：获取弹幕服务器地址和 token
    const confRes = await fetch(`https://api.live.bilibili.com/room/v1/Danmu/getConf?room_id=${realRoomId}&platform=pc&player=web`);
    const confData = await confRes.json();
    if (confData.code !== 0) throw new Error(`获取弹幕配置失败: ${confData.message}`);
    const host = confData.data.host;
    const token = confData.data.token;
    return { realRoomId, host, token };
}

/**
 * 构建 B站弹幕协议数据包（二进制）
 */
function encodePacket(data, op) {
    // 数据包结构: 长度(4字节) + 头部(16字节) + 数据
    const body = typeof data === 'string' ? new TextEncoder().encode(data) : data;
    const packet = new ArrayBuffer(16 + body.length);
    const view = new DataView(packet);
    view.setUint32(0, 16 + body.length, false);          // 总长度
    view.setUint16(4, 16, false);                         // 头部长度
    view.setUint16(6, 1, false);                          // 协议版本 (1=普通, 3=压缩)
    view.setUint32(8, op, false);                         // 操作码 (2=心跳, 7=认证, 8=心跳回复)
    view.setUint32(12, 1, false);                         // 序列号
    if (body.length > 0) {
        new Uint8Array(packet, 16).set(new Uint8Array(body));
    }
    return packet;
}

/**
 * 解码弹幕数据包（处理可能的 zlib 压缩）
 */
function decodePacket(data) {
    // 这里简化处理，仅解析普通的 JSON 弹幕，不处理压缩
    // 实际上 B站使用 protobuf，但弹幕消息是 JSON 格式
    // 我们只提取 DANMU_MSG 类型的消息
    try {
        const view = new DataView(data);
        const length = view.getUint32(0, false);
        const headerLen = view.getUint16(4, false);
        const protoVer = view.getUint16(6, false);
        const op = view.getUint32(8, false);
        const seq = view.getUint32(12, false);

        if (op === 5) { // 消息
            const body = new Uint8Array(data, headerLen, length - headerLen);
            // 如果 protoVer === 2 或 3，可能需要 zlib 解压，但这里我们先尝试直接解析文本
            // B站弹幕通常是 JSON 字符串
            const text = new TextDecoder().decode(body);
            try {
                const json = JSON.parse(text);
                if (json.cmd === 'DANMU_MSG') {
                    // 解析弹幕
                    const info = json.info;
                    const username = info[2][1]; // 用户名
                    const content = info[1];     // 弹幕内容
                    return { username, content };
                }
            } catch (e) {
                // 忽略非 JSON 数据
            }
        }
    } catch (e) {}
    return null;
}

/**
 * 启动弹幕监听
 */
async function startDanmuListener() {
    if (isConnected) {
        addLog('⚠️ 已处于连接状态', 'warn');
        return;
    }

    try {
        addLog(`🔄 正在获取直播间 ${CONFIG.ROOM_ID} 信息...`, 'info');
        connectionStatus.textContent = '连接中...';
        connectionStatus.className = 'status';

        const { realRoomId, host, token } = await getRoomInfo(CONFIG.ROOM_ID);
        addLog(`✅ 获取成功，真实房间号: ${realRoomId}`, 'ok');

        // 建立 WebSocket
        const wsUrl = `wss://${host}/sub`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            addLog(`🔗 WebSocket 已连接，正在发送认证包...`, 'info');
            // 发送认证包 (操作码 7)
            const authData = {
                uid: CONFIG.UID,
                roomid: realRoomId,
                protover: 3,
                platform: 'web',
                clientver: '1.0.0',
                token: token,
                // 也可以带上 cookie，但一般 token 就够了
            };
            const authJson = JSON.stringify(authData);
            const packet = encodePacket(authJson, 7);
            ws.send(packet);

            // 启动心跳 (每 30 秒)
            if (wsHeartbeatTimer) clearInterval(wsHeartbeatTimer);
            wsHeartbeatTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const heartbeatPacket = encodePacket('', 2);
                    ws.send(heartbeatPacket);
                }
            }, 30000);
        };

        ws.onmessage = (event) => {
            // 可能收到多个数据包（合并），需要循环解析
            const data = event.data;
            if (typeof data === 'string') {
                // 如果是文本，可能是 JSON（但 B站通常二进制）
                return;
            }
            // 处理 ArrayBuffer
            const buffer = data;
            // 简单假设一个包只包含一条消息，实际可能多个，但我们可以循环处理
            const result = decodePacket(buffer);
            if (result) {
                processDanmu(result.username, result.content);
            }
        };

        ws.onclose = (e) => {
            if (isConnected) {
                isConnected = false;
                connectionStatus.textContent = '已断开';
                connectionStatus.className = 'status offline';
                addLog(`🔌 连接已关闭 (code: ${e.code})`, 'warn');
            }
            clearInterval(wsHeartbeatTimer);
            wsHeartbeatTimer = null;
            ws = null;
        };

        ws.onerror = (err) => {
            addLog(`⚠️ WebSocket 错误: ${err.message || '未知错误'}`, 'err');
            // 不会自动重连，需要用户手动点重连
        };

        // 等待 onopen 触发，但为了及时反馈，先假设连接成功，后续通过 onopen/onclose 更新状态
        // 但我们需要一个超时检测
        let timeout = setTimeout(() => {
            if (!isConnected && ws && ws.readyState !== WebSocket.OPEN) {
                addLog('⏳ 连接超时，请检查网络或 Cookie 是否有效', 'warn');
                connectionStatus.textContent = '⏳ 连接超时';
                connectionStatus.className = 'status offline';
                if (ws) ws.close();
            }
        }, 15000);

        // 在 onopen 中清除超时
        const originalOnOpen = ws.onopen;
        ws.onopen = function(e) {
            clearTimeout(timeout);
            isConnected = true;
            connectionStatus.textContent = '✅ 已连接';
            connectionStatus.className = 'status online';
            addLog(`✅ 成功连接到直播间 ${realRoomId}，开始监听弹幕`, 'ok');
            if (typeof originalOnOpen === 'function') originalOnOpen(e);
        };

    } catch (err) {
        addLog(`❌ 连接失败: ${err.message || String(err)}`, 'err');
        connectionStatus.textContent = '❌ 连接失败';
        connectionStatus.className = 'status offline';
        isConnected = false;
        if (ws) ws.close();
        ws = null;
        console.error(err);
    }
}

function stopDanmuListener() {
    if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
    }
    if (wsHeartbeatTimer) {
        clearInterval(wsHeartbeatTimer);
        wsHeartbeatTimer = null;
    }
    isConnected = false;
    connectionStatus.textContent = '已断开';
    connectionStatus.className = 'status offline';
    addLog('⏹️ 已停止监听弹幕', 'info');
}

// UI 事件绑定

btnReconnect.addEventListener('click', () => {
    if (isConnected) stopDanmuListener();
    setTimeout(startDanmuListener, 500);
});
btnDisconnect.addEventListener('click', stopDanmuListener);

btnAddUser.addEventListener('click', () => {
    const name = newUsername.value.trim();
    const tickets = parseInt(newUserTickets.value) || 0;
    if (!name) { addLog('⚠️ 请输入用户名', 'warn'); return; }
    const users = getUsers();
    if (name in users) { addLog(`⚠️ 用户 "${name}" 已存在`, 'warn'); return; }
    users[name] = tickets;
    setUsers(users);
    addLog(`➕ 添加用户: ${name}，初始 ${tickets} 票`, 'ok');
    newUsername.value = '';
    newUserTickets.value = '0';
    renderUserList();
});
newUsername.addEventListener('keypress', e => { if (e.key === 'Enter') btnAddUser.click(); });
newUserTickets.addEventListener('keypress', e => { if (e.key === 'Enter') btnAddUser.click(); });

btnClearAll.addEventListener('click', () => {
    if (!confirm('⚠️ 确定清空所有数据？')) return;
    setUsers({});
    logArea.innerHTML = '';
    addLog('🗑️ 已清空所有数据', 'warn');
    renderUserList();
});

window.addEventListener('beforeunload', () => {
    if (ws) try { ws.close(); } catch (e) {}
    if (wsHeartbeatTimer) clearInterval(wsHeartbeatTimer);
});

// ================================================================
// 初始化
// ================================================================
renderUserList();
addLog('🚀 系统已加载，正在自动连接直播间...', 'info');
setTimeout(startDanmuListener, 500);
</script>
</body>
</html>
